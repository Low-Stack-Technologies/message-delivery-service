openapi: 3.0.3
info:
  title: Message Delivery Service
  description: |
    A robust service for sending emails and SMS messages. 
    
    ### Authentication: Request Signing
    This API uses asymmetric request signing for top-tier security. Clients must sign every request using their **Private Key** (Ed25519) and provide the signature and metadata in headers.
    
    **How to sign a request:**
    1. Construct a string to sign (the "Canonical Request"):
       `Method + "\n" + Path + "\n" + X-Timestamp + "\n" + SHA256(Body)`
    2. Sign this string using your private key.
    3. Include the signature as a Base64-encoded string in the `Authorization` header.
  version: 3.2.0
servers:
  - url: http://localhost:3000
    description: Local Development Environment

components:
  securitySchemes:
    signatureAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Format: `Signature <base64_signature>`
        Required alongside `X-Client-Id` and `X-Timestamp`.
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Bearer token for admin-only browser operations.

  parameters:
    ClientIdHeader:
      name: X-Client-Id
      in: header
      required: true
      schema:
        type: string
      description: The unique ID assigned to your service.
    TimestampHeader:
      name: X-Timestamp
      in: header
      required: true
      schema:
        type: string
        format: date-time
      description: ISO 8601 timestamp. Requests older than 5 minutes will be rejected.

  schemas:
    # --- Error & Success ---
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: "SIGNATURE_INVALID"
            message:
              type: string
              example: "The provided signature does not match the request content."
            details:
              type: array
              items:
                type: string
              example: ["Check your canonical request construction"]

    SuccessResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully."
        data:
          type: object

    # --- Email ---
    EmailContact:
      type: object
      required: [address]
      properties:
        name:
          type: string
          example: "John Doe"
        address:
          type: string
          format: email
          example: "john.doe@example.com"

    EmailRequest:
      type: object
      required: [to, from, subject]
      properties:
        to:
          description: A single recipient or an array of recipients.
          oneOf:
            - type: string
              format: email
              example: "recipient@example.com"
            - $ref: '#/components/schemas/EmailContact'
            - type: array
              items:
                oneOf:
                  - type: string
                    format: email
                  - $ref: '#/components/schemas/EmailContact'
              example: ["one@example.com", "two@example.com"]
        from:
          $ref: '#/components/schemas/EmailContact'
        subject:
          type: string
          example: "Welcome to our Service"
        content:
          type: object
          oneOf:
            - required: [body]
              properties:
                body:
                  type: string
                  example: "Hello, this is a plain text message."
                isHtml:
                  type: boolean
                  default: false
            - required: [template]
              properties:
                template:
                  type: object
                  required: [name, data]
                  properties:
                    name:
                      type: string
                      example: "welcome-email"
                    data:
                      type: object
                      additionalProperties: true
                      example:
                        name: "John"

    # --- SMS ---
    SmsRecipient:
      oneOf:
        - type: string
          description: Phone number in E.164 format.
          example: "+46700000000"
        - type: object
          required: [phone, country]
          properties:
            phone:
              type: string
              example: "0700000000"
            country:
              type: string
              minLength: 2
              maxLength: 2
              description: ISO 3166-1 alpha-2 country code.
              example: "SE"

    SmsRequest:
      type: object
      required: [to, senderName]
      properties:
        to:
          description: A single recipient or an array of recipients.
          oneOf:
            - $ref: '#/components/schemas/SmsRecipient'
            - type: array
              items:
                $ref: '#/components/schemas/SmsRecipient'
              example: ["+46700000000", "+46700000001"]
        senderName:
          type: string
          minLength: 3
          maxLength: 11
          example: "MyService"
        content:
          type: object
          oneOf:
            - required: [body]
              properties:
                body:
                  type: string
                  maxLength: 160
                  example: "Your verification code is 1234."
            - required: [template]
              properties:
                template:
                  type: object
                  required: [name, data]
                  properties:
                    name:
                      type: string
                      example: "otp-sms"
                    data:
                      type: object
                      additionalProperties: true
                      example:
                        code: "1234"

    SmsSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            meta:
              type: object
              properties:
                cost:
                  type: number
                  format: float
                  example: 0.35
                currency:
                  type: string
                  example: "SEK"

    # --- Admin ---
    AdminServiceScope:
      type: string
      enum: [all, email, sms]
    AdminServiceStatus:
      type: string
      enum: [active, paused]
    AdminEmailAccountStatus:
      type: string
      enum: [healthy, warning, offline]
    AdminActivityTone:
      type: string
      enum: [info, success, warning, danger]
    AdminMessageChannel:
      type: string
      enum: [email, sms]
    AdminMessageContentMode:
      type: string
      enum: [plain, html, template]

    AdminService:
      type: object
      required: [id, name, scope, status, publicKey]
      properties:
        id:
          type: string
          example: billing-api
        name:
          type: string
          example: Billing API
        owner:
          type: string
          example: Core Platform
        scope:
          $ref: '#/components/schemas/AdminServiceScope'
        status:
          $ref: '#/components/schemas/AdminServiceStatus'
        publicKey:
          type: string
          example: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBillingApiExampleKey
        notes:
          type: string
          example: Primary transactional consumer for invoices and receipts.
        createdAt:
          type: string
          format: date-time
        lastRerollAt:
          type: string
          format: date-time
          nullable: true
    AdminServiceCreateRequest:
      type: object
      required: [id, name, scope, status, publicKey]
      properties:
        id:
          type: string
        name:
          type: string
        owner:
          type: string
        scope:
          $ref: '#/components/schemas/AdminServiceScope'
        status:
          $ref: '#/components/schemas/AdminServiceStatus'
        publicKey:
          type: string
        notes:
          type: string
    AdminServiceUpdateRequest:
      type: object
      properties:
        name:
          type: string
        owner:
          type: string
        scope:
          $ref: '#/components/schemas/AdminServiceScope'
        status:
          $ref: '#/components/schemas/AdminServiceStatus'
        publicKey:
          type: string
        notes:
          type: string
    AdminServiceListResponse:
      type: object
      required: [success, services]
      properties:
        success:
          type: boolean
          example: true
        services:
          type: array
          items:
            $ref: '#/components/schemas/AdminService'
    AdminServiceResponse:
      type: object
      required: [success, service]
      properties:
        success:
          type: boolean
          example: true
        service:
          $ref: '#/components/schemas/AdminService'
    AdminServiceRerollResponse:
      type: object
      required: [success, service, privateKey]
      properties:
        success:
          type: boolean
          example: true
        service:
          $ref: '#/components/schemas/AdminService'
        privateKey:
          type: string
          description: One-time secret returned when a keypair is rerolled.
    AdminEmailSmtpConfig:
      type: object
      required: [host, port, username, password]
      properties:
        host:
          type: string
          example: smtp.example.com
        port:
          type: integer
          example: 587
        username:
          type: string
          example: support@example.com
        password:
          type: string
          example: super-secret-password
    AdminEmailAccount:
      type: object
      required: [id, address, smtp, status]
      properties:
        id:
          type: string
          example: support
        address:
          type: string
          format: email
          example: support@example.com
        displayName:
          type: string
          example: Support Desk
        smtp:
          $ref: '#/components/schemas/AdminEmailSmtpConfig'
        isDefault:
          type: boolean
          example: true
        status:
          $ref: '#/components/schemas/AdminEmailAccountStatus'
        lastTestedAt:
          type: string
          format: date-time
          nullable: true
    AdminEmailAccountCreateRequest:
      type: object
      required: [id, address, smtp]
      properties:
        id:
          type: string
        address:
          type: string
          format: email
        displayName:
          type: string
        smtp:
          $ref: '#/components/schemas/AdminEmailSmtpConfig'
        isDefault:
          type: boolean
    AdminEmailAccountUpdateRequest:
      type: object
      properties:
        address:
          type: string
          format: email
        displayName:
          type: string
        smtp:
          $ref: '#/components/schemas/AdminEmailSmtpConfig'
        isDefault:
          type: boolean
    AdminEmailAccountListResponse:
      type: object
      required: [success, emailAccounts]
      properties:
        success:
          type: boolean
          example: true
        emailAccounts:
          type: array
          items:
            $ref: '#/components/schemas/AdminEmailAccount'
    AdminEmailAccountResponse:
      type: object
      required: [success, emailAccount]
      properties:
        success:
          type: boolean
          example: true
        emailAccount:
          $ref: '#/components/schemas/AdminEmailAccount'
    AdminEmailAccountTestResponse:
      type: object
      required: [success, emailAccount, testedAt]
      properties:
        success:
          type: boolean
          example: true
        emailAccount:
          $ref: '#/components/schemas/AdminEmailAccount'
        testedAt:
          type: string
          format: date-time
        message:
          type: string
          example: SMTP connection validated successfully.
    AdminSmsCredentials:
      type: object
      required: [username, password, status, lastSyncedAt, rotationCount]
      properties:
        username:
          type: string
          example: api_user_id
        password:
          type: string
          example: api_password
        status:
          type: string
          enum: [connected, stale]
        lastSyncedAt:
          type: string
          format: date-time
        rotationCount:
          type: integer
          example: 2
    AdminSmsCredentialsUpdateRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    AdminSmsCredentialsResponse:
      type: object
      required: [success, smsCredentials]
      properties:
        success:
          type: boolean
          example: true
        smsCredentials:
          $ref: '#/components/schemas/AdminSmsCredentials'
    AdminSmsCredentialsRotateResponse:
      type: object
      required: [success, smsCredentials]
      properties:
        success:
          type: boolean
          example: true
        smsCredentials:
          $ref: '#/components/schemas/AdminSmsCredentials'
    AdminMessageTemplate:
      type: object
      required: [name, data]
      properties:
        name:
          type: string
          example: welcome-email
        data:
          type: object
          additionalProperties: true
          example:
            name: John
    AdminMessageRequest:
      type: object
      required: [channel, serviceId, recipients, contentMode]
      properties:
        channel:
          $ref: '#/components/schemas/AdminMessageChannel'
        serviceId:
          type: string
          example: billing-api
        recipients:
          type: array
          items:
            type: string
          example: ["one@example.com", "two@example.com"]
        from:
          type: string
          format: email
          example: support@example.com
        senderName:
          type: string
          example: MyService
        subject:
          type: string
          example: Welcome to our Service
        contentMode:
          $ref: '#/components/schemas/AdminMessageContentMode'
        body:
          type: string
          example: Hello, this is a plain text message.
        template:
          $ref: '#/components/schemas/AdminMessageTemplate'
    AdminMessage:
      type: object
      required: [id, channel, serviceId, recipients, sender, contentMode, createdAt, status]
      properties:
        id:
          type: string
          example: msg-1001
        channel:
          $ref: '#/components/schemas/AdminMessageChannel'
        serviceId:
          type: string
          example: billing-api
        recipients:
          type: array
          items:
            type: string
        sender:
          type: string
          example: support@example.com
        subject:
          type: string
          nullable: true
        contentMode:
          $ref: '#/components/schemas/AdminMessageContentMode'
        body:
          type: string
          nullable: true
        templateName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [queued, accepted]
    AdminMessageListResponse:
      type: object
      required: [success, messages]
      properties:
        success:
          type: boolean
          example: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AdminMessage'
    AdminMessageSubmitResponse:
      type: object
      required: [success, message, queuedMessage]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Message queued successfully.
        queuedMessage:
          $ref: '#/components/schemas/AdminMessage'
    AdminMessagePreviewResponse:
      type: object
      required: [success, preview]
      properties:
        success:
          type: boolean
          example: true
        preview:
          type: object
          required: [request, rendered]
          properties:
            request:
              $ref: '#/components/schemas/AdminMessageRequest'
            rendered:
              type: string
              example: Preview of the delivery payload.
            warnings:
              type: array
              items:
                type: string
    AdminActivity:
      type: object
      required: [id, title, detail, tone, createdAt]
      properties:
        id:
          type: string
          example: activity-1
        title:
          type: string
          example: Service key rotated
        detail:
          type: string
          example: Billing API generated a new signing key.
        tone:
          $ref: '#/components/schemas/AdminActivityTone'
        createdAt:
          type: string
          format: date-time
    AdminDashboardResponse:
      type: object
      required: [success, summary, recentActivity, recentMessages]
      properties:
        success:
          type: boolean
          example: true
        summary:
          type: object
          required: [services, activeServices, emailAccounts, defaultEmailAccount, smsStatus, queuedMessages]
          properties:
            services:
              type: integer
              example: 3
            activeServices:
              type: integer
              example: 2
            emailAccounts:
              type: integer
              example: 2
            defaultEmailAccount:
              type: string
              nullable: true
              example: support@example.com
            smsStatus:
              type: string
              enum: [connected, stale]
            queuedMessages:
              type: integer
              example: 2
        recentActivity:
          type: array
          items:
            $ref: '#/components/schemas/AdminActivity'
        recentMessages:
          type: array
          items:
            $ref: '#/components/schemas/AdminMessage'
    AdminUser:
      type: object
      required: [id, username, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: admin-1
        username:
          type: string
          example: admin
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
    AdminUserCredentials:
      type: object
      required: [password, totpSecret, provisioningUri]
      properties:
        password:
          type: string
          example: 2gW7B...
        totpSecret:
          type: string
          example: JBSWY3DPEHPK3PXP
        provisioningUri:
          type: string
          example: otpauth://totp/Message%20Delivery%20Service:admin?secret=JBSWY3DPEHPK3PXP
    AdminUserCreateRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          example: admin
    AdminUserCreateResponse:
      type: object
      required: [success, user, credentials]
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: '#/components/schemas/AdminUser'
        credentials:
          $ref: '#/components/schemas/AdminUserCredentials'
    AdminUserListResponse:
      type: object
      required: [success, users]
      properties:
        success:
          type: boolean
          example: true
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    AdminLoginRequest:
      type: object
      required: [username, password, totpCode]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: correct-horse-battery-staple
        totpCode:
          type: string
          example: "123456"
    AdminLoginResponse:
      type: object
      required: [success, token, expiresAt, user]
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: eyJhbGciOi...
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AdminUser'
    AdminMeResponse:
      type: object
      required: [success, user]
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: '#/components/schemas/AdminUser'

security:
  - signatureAuth: []

paths:
  /health:
    get:
      summary: Service Health Check
      description: Returns the status of the service and its dependencies.
      security: [] # Public endpoint
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    format: date-time
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v3/email:
    post:
      summary: Send an Email
      tags:
        - Messaging
      parameters:
        - $ref: '#/components/parameters/ClientIdHeader'
        - $ref: '#/components/parameters/TimestampHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Email accepted for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v3/sms:
    post:
      summary: Send an SMS
      tags:
        - Messaging
      parameters:
        - $ref: '#/components/parameters/ClientIdHeader'
        - $ref: '#/components/parameters/TimestampHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsRequest'
      responses:
        '202':
          description: SMS accepted for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSuccessResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v3/admin/dashboard:
    get:
      summary: Admin dashboard summary
      tags:
        - Admin
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v3/admin/auth/login:
    post:
      summary: Log in to the admin console
      tags:
        - Admin
      operationId: adminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v3/admin/auth/me:
    get:
      summary: Inspect the current admin session
      tags:
        - Admin
      operationId: getAdminAuthMe
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Current session user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v3/admin/users:
    get:
      summary: List admin users
      tags:
        - Admin
      operationId: getAdminUsers
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Admin users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create an admin user
      tags:
        - Admin
      operationId: createAdminUser
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
      responses:
        '201':
          description: Admin user created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserCreateResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v3/admin/services:
    get:
      summary: List services with API access
      tags:
        - Admin
      operationId: getAdminServices
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Registered services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceListResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a service identity
      tags:
        - Admin
      operationId: createAdminService
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminServiceCreateRequest'
      responses:
        '201':
          description: Service created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v3/admin/services/{serviceId}:
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a service identity
      tags:
        - Admin
      operationId: getAdminService
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Service details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a service identity
      tags:
        - Admin
      operationId: updateAdminService
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminServiceUpdateRequest'
      responses:
        '200':
